services:
  - type: web
    name: pcg-membership
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.17.0  # Change this from 24.x
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1